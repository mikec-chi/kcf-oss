name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    name: Open-core boundary (no proprietary markers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan substance trees
        # Fail if a proprietary marker leaked into the open-source substance
        # (kcf-oss/, semantic-core/, community/). The repo-root scaffold
        # (OPEN_CORE.md, NOTICE, README) names the proprietary platform on purpose
        # and is out of scope; .github/ is not scanned, so this workflow's own
        # pattern list never self-trips.
        run: |
          dirs=""
          for d in kcf-oss semantic-core community; do [ -d "$d" ] && dirs="$dirs $d"; done
          if grep -rIilE --exclude-dir=.git --exclude-dir=__pycache__ --exclude-dir=tmp --exclude-dir=packaging \
               -e 'taliden|licenseref-taliden-proprietary|confidential & proprietary|vendor/kcf|knowledge-graph emitter|knowledge_graph' \
               $dirs; then
            echo "::error::Proprietary marker found in the open-source substance trees (see files above)."
            exit 1
          fi
          echo "OK: open-core boundary clean —$dirs"

  gate:
    name: kcf check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build semantic rule catalogues
        run: |
          python semantic-core/tools/build_rules.py
          python kcf-oss/tools/build_semantic_rules.py

      - name: Conformance gate (kcf check)
        run: kcf check

      - name: Full stack validation
        run: |
          python kcf-oss/tools/validate_stack.py
          python kcf-oss/tools/lint_stack.py

      - name: Quickstart is reproducible (compile -> assess -> ready)
        run: |
          kcf compile kcf-oss/tests/domains/business-application.kcf --output /tmp/model-ir.json --validate
          kcf assess /tmp/model-ir.json
          python -c "import json; d=json.load(open('/tmp/model-ir.json')); assert d['concepts'], 'empty IR'"

      - name: Codegen pack is present (OSS stops at the IR)
        run: |
          test -f kcf-oss/codegen/system-prompt.md
          test -f kcf-oss/codegen/stacks/fastapi-sqlmodel-postgres/EXAMPLE.md

      - name: Community models are valid
        run: python community/models/validate.py
